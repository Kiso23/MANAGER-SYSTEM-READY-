version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_manager_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - task_manager_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_manager_backend_prod
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-taskuser}:${DB_PASSWORD:-change-this-password}@postgres:5432/task_manager"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      NODE_ENV: "production"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - task_manager_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_manager_frontend_prod
    environment:
      VITE_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - task_manager_network

  nginx:
    image: nginx:alpine
    container_name: task_manager_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - task_manager_network

volumes:
  postgres_data_prod:

networks:
  task_manager_network:
    driver: bridge
