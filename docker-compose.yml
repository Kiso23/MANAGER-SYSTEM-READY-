version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_manager_backend
    environment:
      DATABASE_URL: "postgresql://taskuser:taskpass123@postgres:5432/task_manager"
      JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
      NODE_ENV: "production"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_manager_frontend
    environment:
      VITE_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
